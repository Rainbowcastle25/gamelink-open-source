    <rect x="-19.2" y="-9.92" width="38.4" height="19.84" rx="9.92" transform="translate(36.8 27.2) rotate(45)"/>
    <rect x="-19.2" y="-9.92" width="38.4" height="19.84" rx="9.92" transform="translate(27.2 36.8) rotate(45)"/>
