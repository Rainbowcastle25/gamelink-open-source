name: Publish apt repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && 'apt-pages' || format('apt-route-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Release events use tag refs. Dispatch on master so the protected
    # environments see a master branch run and load its reviewed code.
    if: >-
      github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the apt build from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apt-repo.yml --repo "$GITHUB_REPOSITORY" --ref master

  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install apt indexing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils
      - name: Verify published packages and index the repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/apt_repo.py --build "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/site/apt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: apt-unsigned-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site/
          if-no-files-found: error
          compression-level: 0

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: apt-repo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/site
      - name: Sign and verify the apt Release file
        env:
          GAMELINK_APT_SIGNING_KEY: ${{ secrets.GAMELINK_APT_SIGNING_KEY }}
        run: python3 -B scripts/apt_repo.py --sign --output "$RUNNER_TEMP/site/apt"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
