name: External relay test (manual)

# Uses the real public Tailcat relay network over the internet, so it is never
# part of the normal run: it can fail for reasons outside the code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: llvm-tools
      - run: bash scripts/build-rust-ffi.sh
      - run: go test -tags external -run TestPublicRelay -v -count=1 -timeout 10m ./tests/integration
