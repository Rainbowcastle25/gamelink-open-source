# Generates include/gamelink_ffi.h. Regenerate with
# `bash scripts/build-rust-ffi.sh --write-header`; CI-style drift check with
# `bash scripts/build-rust-ffi.sh --check-header`.
language = "C"
style = "type"
include_guard = "GAMELINK_FFI_H"
cpp_compat = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
autogen_warning = "/* Generated by cbindgen from core/crates/gamelink-ffi. Do not edit by hand. */"
documentation = true
documentation_style = "c99"

[export]
include = ["GamelinkBuffer"]
# The JNI entrypoint is Android-only and is not part of the C ABI.
exclude = ["Java_io_gamelink_app_Core_nativeReduce", "MAX_INPUT_BYTES"]

[parse]
parse_deps = false
