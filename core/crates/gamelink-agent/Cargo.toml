[package]
name = "gamelink-agent"
version = "0.2.0-alpha"
edition.workspace = true
publish.workspace = true

[dependencies]
gamelink-core = { workspace = true, features = ["update-notifications"] }
serde.workspace = true
serde_json.workspace = true
libc = "=0.2.191"
clap = { version = "=4.5.60", default-features = false, features = ["std"] }
chrono = { version = "=0.4.44", default-features = false, features = ["std", "clock", "serde"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
sha2 = "=0.10.9"
url = "=2.5.8"
tempfile = "=3.24.0"
