[package]
name = "gamelink-desktop"
version = "0.2.0-alpha"
edition = "2021"
publish = false

# Deliberately separate: core/Android checks do not resolve GTK/WebKit.
[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
gamelink-core = { path = "../../core/crates/gamelink-core", features = ["update-notifications"] }
serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }
chrono = { version = "=0.4.44", default-features = false, features = ["std", "clock"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "=2.5.8"

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "=3.24.0"
