[package]
name = "gamelink-desktop"
version = "0.2.0-alpha"
edition = "2021"
publish = false

# Deliberately separate: core/Android checks do not resolve GTK/WebKit.
[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
gamelink-core = { path = "../../core/crates/gamelink-core", features = ["update-notifications"] }
serde_json = "=1.0.149"
serde = { version = "=1.0.228", features = ["derive"] }
chrono = { version = "=0.4.44", default-features = false, features = ["std", "clock"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
url = "=2.5.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["process"] }
tempfile = "=3.24.0"

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
png = "=0.18.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
minisign = "=0.10.0"
tauri = { version = "2", features = ["test"] }
tempfile = "=3.24.0"
